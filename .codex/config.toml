# Codex 项目级配置
#
# 说明：
# - 此文件会被 Codex 在项目目录中自动加载
# - MCP 服务器也可用命令行管理：codex mcp add <name> -- <command>
# - 文档：https://developers.openai.com/codex/config/

[mcp_servers.docx-mcp]
command = "uvx"
args = ["docx-mcp"]

[mcp_servers.ragflow]
command = "uv"
args = [
  "run",
  "--directory",
  "D:\\ragflow-mcp",
  "python",
  "-m",
  "src.server",
]
env = { RAGFLOW_API_KEY = "your-ragflow-api-key", RAGFLOW_URL = "http://192.168.10.13:9380/api/v1" }

[mcp_servers.pdf-reader]
command = "npx"
args = ["-y", "@sylphx/pdf-reader-mcp"]

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.excel]
command = "npx"
args = ["-y", "excel-mcp-server"]

[mcp_servers.web-browsing-mcp]
command = "npx"
args = ["-y", "@leonardocerv/web-browsing-mcp"]

# ---------------------------------------------------------------
# 状态文件强制检查（Stop 钩子）
# 每轮结束后检查：改了代码/文档但没更新 docs/PROJECT_STATUS.md 时告警。
# 依赖 Git 仓库（项目内运行 git init 后生效）；不需要时注释掉本段。
# 首次运行 Codex 会询问是否信任此钩子，选择信任即可。
# ---------------------------------------------------------------
[hooks]
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-status.ps1"
timeout = 30
